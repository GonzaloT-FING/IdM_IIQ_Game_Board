<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IdM Trivia 2</title>
  <style>
    :root{
      --page:#f4f6f5; --surface:#fffffff0; --solid:#fff; --card:#fafafa; --ink:#18181b; --muted:#52525b; --line:#d4d4d8; --active-row:#dcfce7;
      --button:rgba(255,255,255,.88); --button-subtle:rgba(255,255,255,.68); --grid-line:rgba(24,24,27,.05);
      --page-bg:radial-gradient(circle at 8% 0%,rgba(15,118,110,.18),transparent 28rem),radial-gradient(circle at 90% 12%,rgba(202,138,4,.16),transparent 24rem),linear-gradient(160deg,#f4f6f5 0%,#e8efed 58%,#f7f7f7 100%);
      --green:#0f766e; --red:#be123c; --blue:#2563eb; --yellow:#ca8a04; --violet:#7c3aed;
      --qSize:42px; --optSize:28px; --expSize:24px; --barH:36px;
      --qFont:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --optFont:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --expFont:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --qColor:#18181b; --optColor:#fff; --expColor:#18181b; --qWeight:900; --optWeight:800; --expWeight:600;
    }
    :root[data-theme="dark"]{color-scheme:dark;--page:#09090b;--surface:#18181bf2;--solid:#18181b;--card:#27272a;--ink:#f4f4f5;--muted:#a1a1aa;--line:#3f3f46;--active-row:#134e4a;--button:rgba(63,63,70,.92);--button-subtle:rgba(63,63,70,.62);--grid-line:rgba(255,255,255,.055);--page-bg:radial-gradient(circle at 8% 0%,rgba(15,118,110,.24),transparent 30rem),radial-gradient(circle at 90% 12%,rgba(124,58,237,.18),transparent 26rem),linear-gradient(160deg,#09090b 0%,#18181b 58%,#0f172a 100%)}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;min-height:100vh;min-height:100svh;overflow:hidden;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:0;background:var(--page-bg)}
    button,input,select{font:inherit;letter-spacing:0}button{cursor:pointer}
    .bg{position:fixed;inset:0;z-index:-2;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:.18}
    .grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,#000,transparent)}
    #fxCanvas{position:fixed;inset:0;z-index:200;pointer-events:none}.flash{position:fixed;inset:0;z-index:150;pointer-events:none;opacity:0;transition:opacity .22s ease}.flash.on{opacity:.22}.flash.good{background:var(--green)}.flash.bad{background:var(--red)}.flash.fortune{background:var(--yellow)}
    .shell{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand svg{width:42px;height:42px;flex:none}.brand h1{margin:0;font-size:32px;line-height:1.1;white-space:nowrap}
    .toolbar,.float,.dice-actions,.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding-bottom:64px}.panel{width:min(1780px,100%);border:1px solid rgba(212,212,216,.8);border-radius:8px;background:var(--surface);box-shadow:0 18px 50px rgba(24,24,27,.18);padding:24px}.home{display:grid;grid-template-columns:minmax(360px,680px) 1fr;gap:28px;align-items:center}.board{width:100%;max-width:720px;margin:auto;display:block}.board svg{width:100%;height:auto;display:block;overflow:visible}.board-case{fill:#fff;stroke:#a1a1aa;stroke-width:5;transition:fill .2s ease,stroke .2s ease,opacity .2s ease}.board-case.route-off{opacity:.2}.board-case.route-on{stroke:#18181b}.board-case.active-case{stroke:#fff;stroke-width:10;filter:drop-shadow(0 0 8px rgba(24,24,27,.7))}.board-case.hint-case{animation:caseBlink .7s steps(1,end) infinite}@keyframes caseBlink{50%{fill:#fff}}.player-token{stroke:#fff;stroke-width:5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));pointer-events:none}.token-label{fill:#fff;font-size:24px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}.case-label{fill:#18181b;font-size:20px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
    .head,.foot,.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{margin:0;font-size:34px;line-height:1.12;font-weight:900}.muted{color:var(--muted);font-size:16px;line-height:1.4}.status{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;white-space:nowrap}.dot{width:12px;height:12px;border-radius:999px;background:#a1a1aa;display:inline-block}.dot.good,.dot.connected{background:var(--green)}.dot.bad{background:var(--red)}
    .question{margin:0 0 18px;font-family:var(--qFont);font-size:var(--qSize);line-height:1.18;color:var(--qColor);font-weight:var(--qWeight)}.question-layout{width:100%}.question-layout.has-media{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(520px,1.2fr);gap:28px;align-items:start}.question-copy{min-width:0}.question-media{margin:0 0 18px;display:grid;justify-items:center;gap:7px}.question-layout.has-media .question-media{margin:0}.question-media img{display:block;max-width:min(720px,100%);max-height:32svh;width:auto;height:auto;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:0 10px 26px rgba(24,24,27,.16)}.question-layout.has-media .question-media img{width:100%;max-width:560px;max-height:58svh}.question-media figcaption{max-width:720px;color:var(--muted);font-size:14px;line-height:1.3;text-align:center}.options,.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.modes{margin-top:16px}.answer,.mode-btn{min-height:78px;border:2px solid transparent;border-radius:8px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--optColor);font-family:var(--optFont);font-size:var(--optSize);font-weight:var(--optWeight);text-shadow:0 1px 1px rgba(0,0,0,.35);transition:transform .12s ease,filter .12s ease,opacity .12s ease}.answer:hover,.mode-btn:hover,.btn:hover{filter:brightness(1.04)}.answer:active,.mode-btn:active,.btn:active{transform:translateY(1px)}
    .blue{background:linear-gradient(135deg,var(--blue),#1d4ed8)}.green{background:linear-gradient(135deg,var(--green),#115e59)}.yellow{background:linear-gradient(135deg,var(--yellow),#a16207)}.red{background:linear-gradient(135deg,var(--red),#9f1239)}.answer.dim{opacity:.34;filter:saturate(.8)}.answer.correct{border-color:#2dd4bf;box-shadow:inset 0 0 0 3px rgba(45,212,191,.9)}.answer.wrong{border-color:#fb7185;box-shadow:inset 0 0 0 3px rgba(251,113,133,.9)}
    .chip{width:34px;height:34px;border-radius:999px;border:3px solid rgba(255,255,255,.92);background:rgba(255,255,255,.24);flex:none;box-shadow:inset 0 0 0 2px rgba(24,24,27,.1)}.explain{margin-top:18px;padding:18px;border-radius:8px;border:2px dashed var(--line);background:var(--card);color:var(--expColor);font-family:var(--expFont);font-size:var(--expSize);font-weight:var(--expWeight);line-height:1.4}
    .progress{height:var(--barH);border:3px solid rgba(255,255,255,.92);border-radius:999px;background:rgba(24,24,27,.14);overflow:hidden;margin:16px 0;box-shadow:inset 0 2px 5px rgba(24,24,27,.18)}.bar{height:100%;width:100%;background:linear-gradient(90deg,var(--green),#84cc16);transition:width .12s linear,background .12s linear}
    .die-wrap{display:grid;justify-items:center;gap:12px;text-align:center}.die{width:240px;height:240px;max-width:56vw;max-height:56vw}.die svg{width:100%;height:100%;display:block}.die.roll{animation:shake .28s linear infinite}@keyframes shake{0%{transform:rotate(-5deg)}25%{transform:rotate(4deg) translate(2px,-1px)}50%{transform:rotate(-3deg) translate(-2px,1px)}75%{transform:rotate(3deg) translate(1px,-2px)}100%{transform:rotate(0)}}
    .btn{border:1px solid var(--line);border-radius:8px;padding:10px 13px;background:var(--button);color:var(--ink);font-weight:800;box-shadow:0 8px 20px rgba(24,24,27,.12)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.subtle{background:var(--button-subtle);box-shadow:none}
    .float{position:fixed;left:18px;bottom:18px;z-index:110}.dice-actions{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:110;justify-content:center}.dice-actions[hidden]{display:none}.idle-launcher{position:fixed;right:18px;bottom:18px;z-index:112}.idle{position:fixed;right:18px;bottom:72px;z-index:112;width:min(360px,calc(100vw - 36px));display:grid;gap:10px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--solid);box-shadow:0 18px 50px rgba(24,24,27,.18)}.idle[hidden]{display:none}.idle h2{margin:0;font-size:20px}
    .input,select,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--solid);color:var(--ink);padding:10px 12px}input[type=color]{width:56px;min-height:40px;padding:4px}input[type=range]{width:min(280px,100%)}.settings-grid{display:grid;grid-template-columns:220px 1fr 110px 170px 120px;gap:10px;align-items:center;margin-top:10px}.key-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}.field{display:grid;gap:6px;color:var(--muted);font-weight:700;font-size:14px}.setup-list{display:grid;gap:10px;margin:18px 0}.player-row{display:grid;grid-template-columns:40px minmax(160px,1fr) auto;gap:12px;align-items:center}.player-number{font-weight:900;text-align:center}.player-color-palette{display:grid;grid-template-columns:repeat(6,26px);gap:6px;margin:0;padding:4px;border:0;min-width:0}.player-color-swatch{width:26px;height:26px;padding:0;border:2px solid var(--solid);border-radius:999px;box-shadow:0 0 0 1px var(--line);transition:transform .12s ease,box-shadow .12s ease}.player-color-swatch:hover{transform:scale(1.08)}.player-color-swatch[aria-checked="true"]{transform:scale(.92);box-shadow:0 0 0 2px var(--solid),0 0 0 5px var(--ink)}.game-mode-option{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.game-layout{display:grid;grid-template-columns:minmax(680px,1fr) minmax(320px,430px);gap:28px;align-items:start}.game-layout .board{max-width:min(100%,calc((100svh - 235px)*1.204))}.game-side{display:grid;gap:14px}.turn-card,.score-card,.branch-card{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:16px}.turn-card h3,.score-card h3,.branch-card h3{margin:0 0 8px}.scoreboard{width:100%;border-collapse:collapse}.scoreboard th,.scoreboard td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.scoreboard tr.active{background:var(--active-row)}.scoreboard tr.finished{opacity:.72}.scoreboard .score-heading,.scoreboard .score-value{text-align:right}.scoreboard .score-value{font-size:28px;line-height:1;font-weight:950;font-variant-numeric:tabular-nums}.score-dot{width:16px;height:16px;border-radius:999px;display:inline-block;vertical-align:-2px;margin-right:7px;border:2px solid #fff;box-shadow:0 0 0 1px #a1a1aa}.game-actions{display:flex;gap:10px;flex-wrap:wrap}.game-actions .btn.primary{font-size:18px;padding:13px 18px}.phase-note{margin:8px 0 0}.winner{text-align:center;display:grid;justify-items:center;gap:14px}.winner-tokens{display:flex;justify-content:center;gap:12px}.winner-token{width:96px;height:96px;border-radius:999px;border:8px solid #fff;box-shadow:0 10px 28px rgba(0,0,0,.25)}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}.legend span{padding:5px 8px;border-radius:999px;color:#fff;font-weight:800}.btn:disabled{cursor:not-allowed;opacity:.45;filter:none}.dice-inline{display:flex;align-items:center;gap:14px}.turn-icon{width:92px;height:72px;flex:0 0 92px}.turn-icon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}.game-die-panel{width:min(1000px,100%);min-height:0;display:grid;place-items:center;text-align:center;padding:20px}.game-die-panel .die-wrap{gap:12px}.game-die-panel .die{width:min(46svh,46vw,480px);height:min(46svh,46vw,480px);max-width:none;max-height:none}.game-die-panel .question{margin:0}.game-die-hint{font-size:22px;font-weight:800}
    .modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:18px;background:rgba(9,9,11,.62)}.modal[hidden]{display:none}.modal-panel{width:min(1120px,100%);max-height:calc(100vh - 36px);overflow:auto;border-radius:8px;border:1px solid var(--line);background:var(--solid);box-shadow:0 18px 50px rgba(24,24,27,.18);padding:22px}.section{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}.section h3{margin:0 0 10px;font-size:20px}.toast{position:fixed;right:18px;top:18px;z-index:400;width:min(460px,calc(100vw - 36px));border:1px solid var(--line);border-radius:8px;background:var(--solid);box-shadow:0 18px 50px rgba(24,24,27,.18);padding:12px 14px;display:grid;gap:6px}.toast[hidden]{display:none}.hidden-file{position:absolute;left:-9999px;opacity:0;width:1px;height:1px}.toast pre{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:13px;font-family:inherit}
    @media(max-height:800px){.question-media img{max-height:25svh}.game-die-panel .die{width:min(40svh,40vw,400px);height:min(40svh,40vw,400px)}}@media(max-width:1100px){.question-layout.has-media{grid-template-columns:1fr}.question-layout.has-media .question-media img{width:auto;max-height:38svh}}@media(max-width:960px){body{overflow:auto}.shell{position:relative;min-height:100svh}.topbar{align-items:flex-start;flex-direction:column}.stage{padding-bottom:120px}.home,.game-layout{grid-template-columns:1fr}.board{max-width:620px}.options,.modes{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.key-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.title{font-size:28px}.brand h1{font-size:28px}.panel{padding:18px}.question-media img{max-height:38svh}}@media(max-width:640px){.key-grid{grid-template-columns:1fr}.dice-actions{left:18px;right:18px;bottom:68px;transform:none}.float{bottom:70px}.toolbar{width:100%}.toolbar .btn{flex:1 1 auto}.player-row{grid-template-columns:34px minmax(0,1fr)}.player-color-palette{grid-column:2;grid-template-columns:repeat(6,24px)}.player-color-swatch{width:24px;height:24px}}
  </style>
</head>
<body>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div id="bgLayer" class="bg"></div><div class="grid-bg" aria-hidden="true"></div><div id="flashLayer" class="flash" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 64 64" role="img" aria-label="IdM Trivia"><rect x="6" y="6" width="52" height="52" rx="8" fill="#fff" stroke="#18181b" stroke-width="3"/><circle cx="20" cy="20" r="7" fill="#0f766e"/><circle cx="44" cy="20" r="7" fill="#be123c"/><circle cx="20" cy="44" r="7" fill="#2563eb"/><circle cx="44" cy="44" r="7" fill="#ca8a04"/></svg>
        <h1>IdM Trivia</h1>
      </div>
      <div class="toolbar" aria-label="Controles">
        <label class="btn" for="importInput">Importar contenido</label><input id="importInput" class="hidden-file" type="file" accept=".json,.zip,.idmquiz,application/json,application/zip">
        <button id="assetsBtn" class="btn" type="button">Assets</button><button id="questionOptionsBtn" class="btn" type="button">Opciones</button><button id="settingsBtn" class="btn" type="button">Configuracion</button><button id="connectBtn" class="btn primary" type="button">Conectar</button>
        <span id="serialStatus" class="status"><span class="dot"></span><span>Sin pad</span></span>
      </div>
    </header>
    <main id="view" class="stage" tabindex="-1"></main>
  </div>
  <div class="float"><button id="homeBtn" class="btn" type="button">Nueva partida</button><button id="undoBtn" class="btn" type="button">Deshacer</button></div>
  <div class="dice-actions" hidden><button id="diceBtn" class="btn" type="button">Dado</button><button id="dice2Btn" class="btn" type="button">Dado 2</button></div>
  <button id="idleToggleBtn" class="btn idle-launcher" type="button">LED Idle</button>
  <section id="idlePanel" class="idle" hidden aria-label="Configurar modo idle">
    <div class="head"><h2>LED Idle</h2><button id="idleCloseBtn" class="btn subtle" type="button">Cerrar</button></div>
    <div class="inline"><button id="idleOnBtn" class="btn" type="button">Encender</button><button id="idleOffBtn" class="btn" type="button">Apagar</button><button id="idleResetBtn" class="btn" type="button">Reset</button></div>
    <label class="field">Grupos CSV<span class="inline"><input id="idleGroupsInput" type="text" placeholder="14,8,12,12,..."><button id="idleGroupsSend" class="btn" type="button">Enviar</button></span></label>
    <label class="field">Colores CSV<span class="inline"><input id="idleColorsInput" type="text" placeholder="V,B,G,Y,R,..."><button id="idleColorsSend" class="btn" type="button">Enviar</button><button id="idleColorsRand" class="btn" type="button">Aleatorio</button></span></label>
    <div class="muted">Conecta el pad antes de enviar comandos.</div>
  </section>

  <div id="assetsModal" class="modal" hidden>
    <section class="modal-panel" aria-label="Assets">
      <div class="modal-head"><h2 class="title">Assets</h2><button class="btn close-modal" data-close="assetsModal" type="button">Cerrar</button></div>
      <div class="settings-grid">
        <label class="field">Imagen de fondo<input id="bgInput" type="file" accept="image/*"></label>
        <label class="field">Opacidad<input id="bgOpacity" type="range" min="0" max="100" value="18"></label>
        <label class="field">Ajuste<select id="bgFit"><option value="cover">Cover</option><option value="contain">Contain</option></select></label>
        <div></div><button id="clearBgBtn" class="btn" type="button">Quitar fondo</button>
      </div>
    </section>
  </div>

  <div id="questionOptionsModal" class="modal" hidden>
    <section class="modal-panel" aria-label="Opciones de preguntas">
      <div class="modal-head"><h2 class="title">Opciones</h2><button class="btn close-modal" data-close="questionOptionsModal" type="button">Cerrar</button></div>
      <div class="settings-grid">
        <label class="field">Temporizador<input id="timerInput" type="number" min="1" max="180" step="1"></label>
        <label class="field">Barra de tiempo<input id="barHeightInput" type="number" min="8" max="100" step="1"></label>
        <label class="field">Confeti cantidad<input id="confettiCountInput" type="number" min="10" max="1000" step="10"></label>
        <label class="field">Confeti tamano<input id="confettiSizeInput" type="number" min="2" max="20" step="1"></label>
        <label class="field">Confeti dispersion<input id="confettiSpreadInput" type="number" min="0.3" max="2.5" step="0.1"></label>
      </div>
      <section class="section">
        <h3>Puntaje</h3>
        <div class="settings-grid">
          <label class="field">Opción múltiple<input id="scoreMCInput" type="number" min="0" max="100" step="1"></label>
          <label class="field">Verdadero/Falso<input id="scoreTFInput" type="number" min="0" max="100" step="1"></label>
          <label class="field">Fortuna<input id="scoreFortuneInput" type="number" min="-100" max="100" step="1"></label>
          <label class="field">Mala suerte<input id="scoreBadInput" type="number" min="-100" max="100" step="1"></label>
          <label class="field">Bono por llegar primero<input id="scoreFirstFinishInput" type="number" min="0" max="100" step="1"></label>
        </div>
      </section>
    </section>
  </div>

  <div id="settingsModal" class="modal" hidden>
    <section class="modal-panel" aria-label="Configuracion">
      <div class="modal-head"><h2 class="title">Configuracion</h2><button class="btn close-modal" data-close="settingsModal" type="button">Cerrar</button></div>
      <section class="section">
        <h3>Apariencia</h3>
        <button id="themeToggleBtn" class="btn" type="button">Activar modo oscuro</button>
      </section>
      <section class="section">
        <h3>Texto</h3>
        <div class="settings-grid">
          <div class="field">Pregunta</div><input id="questionFontInput" type="text" placeholder="system-ui"><input id="questionSizeInput" type="number" min="16" max="120" step="1"><span class="inline"><input id="questionColorInput" type="color"><input id="questionHexInput" type="text" placeholder="#18181b"></span><label class="inline"><input id="questionBoldInput" type="checkbox"> Negrita</label>
          <div class="field">Opciones</div><input id="optionFontInput" type="text" placeholder="system-ui"><input id="optionSizeInput" type="number" min="14" max="96" step="1"><span class="inline"><input id="optionColorInput" type="color"><input id="optionHexInput" type="text" placeholder="#ffffff"></span><label class="inline"><input id="optionBoldInput" type="checkbox"> Negrita</label>
          <div class="field">Explicacion</div><input id="explanationFontInput" type="text" placeholder="system-ui"><input id="explanationSizeInput" type="number" min="14" max="96" step="1"><span class="inline"><input id="explanationColorInput" type="color"><input id="explanationHexInput" type="text" placeholder="#18181b"></span><label class="inline"><input id="explanationBoldInput" type="checkbox"> Negrita</label>
        </div>
      </section>
      <section class="section">
        <h3>Teclas</h3>
        <div class="key-grid">

      async function unzipEntries(file){const bytes=new Uint8Array(await file.arrayBuffer()),view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),minimum=Math.max(0,bytes.length-65557);let eocd=-1;for(let i=bytes.length-22;i>=minimum;i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break;}}if(eocd<0)throw new Error("El archivo no es un ZIP válido.");const count=view.getUint16(eocd+10,true),directorySize=view.getUint32(eocd+12,true),directoryOffset=view.getUint32(eocd+16,true);if(count===0xffff||directorySize===0xffffffff||directoryOffset===0xffffffff)throw new Error("Los paquetes ZIP64 no son compatibles.");if(count>PACKAGE_LIMITS.entries)throw new Error("El paquete contiene demasiados archivos.");if(directoryOffset+directorySize>bytes.length)throw new Error("El directorio del ZIP está dañado.");const decoder=new TextDecoder("utf-8"),entries=new Map();let cursor=directoryOffset,total=0;for(let index=0;index<count;index++){if(cursor+46>bytes.length||view.getUint32(cursor,true)!==0x02014b50)throw new Error("El directorio del ZIP está dañado.");const flags=view.getUint16(cursor+8,true),method=view.getUint16(cursor+10,true),compressedSize=view.getUint32(cursor+20,true),uncompressedSize=view.getUint32(cursor+24,true),nameLength=view.getUint16(cursor+28,true),extraLength=view.getUint16(cursor+30,true),commentLength=view.getUint16(cursor+32,true),localOffset=view.getUint32(cursor+42,true),nameStart=cursor+46,nameEnd=nameStart+nameLength;if(nameEnd>bytes.length)throw new Error("Nombre de archivo ZIP dañado.");const name=decoder.decode(bytes.subarray(nameStart,nameEnd));cursor=nameEnd+extraLength+commentLength;if(/[\\\/]$/.test(name))continue;if(flags&1)throw new Error("Los paquetes cifrados no son compatibles.");if(uncompressedSize>PACKAGE_LIMITS.entryBytes)throw new Error(`${name} supera el límite de 20 MB.`);const safePath=normalizePackagePath(name);if(localOffset+30>bytes.length||view.getUint32(localOffset,true)!==0x04034b50)throw new Error(`Entrada ZIP dañada: ${safePath}`);const localNameLength=view.getUint16(localOffset+26,true),localExtraLength=view.getUint16(localOffset+28,true),dataStart=localOffset+30+localNameLength+localExtraLength,dataEnd=dataStart+compressedSize;if(dataEnd>bytes.length)throw new Error(`Datos ZIP dañados: ${safePath}`);const data=await decompressZipEntry(bytes.subarray(dataStart,dataEnd),method,safePath);if(data.length!==uncompressedSize)throw new Error(`Tamaño incorrecto al extraer ${safePath}.`);total+=data.length;if(total>PACKAGE_LIMITS.totalBytes)throw new Error("El contenido extraído supera el límite de 150 MB.");entries.set(safePath.toLowerCase(),{path:safePath,data});}return entries;}
      async function decompressZipEntry(data,method,path){if(method===0)return new Uint8Array(data);if(method!==8)throw new Error(`Compresión ZIP no compatible en ${path}.`);if(typeof DecompressionStream!=="function")throw new Error("Este navegador no puede descomprimir paquetes. Usa una versión reciente de Chrome o Edge.");try{const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return new Uint8Array(await new Response(stream).arrayBuffer());}catch{throw new Error(`No se pudo descomprimir ${path}.`);}}
      function normalizePackagePath(value){const path=String(value||"").replace(/\\/g,"/").replace(/^\.\//,"");if(!path||path.startsWith("/")||/^[a-z]:/i.test(path)||path.split("/").some(part=>!part||part===".."))throw new Error("Ruta insegura dentro del paquete.");return path;}
      function imageMimeForPath(path){const ext=String(path||"").split(".").pop().toLowerCase();return {webp:"image/webp",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif"}[ext]||"";}
      function normalizeBool(v){if(typeof v==="boolean")return v; if(typeof v==="number")return v!==0; if(typeof v==="string"){const t=v.trim().toLowerCase(); if(t==="true"||t==="verdadero")return true; if(t==="false"||t==="falso")return false;} return null;}
      function normalizeKey(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
      function randomId(){if(window.crypto&&crypto.getRandomValues){const values=new Uint32Array(1); crypto.getRandomValues(values); return values[0].toString(16);} return Math.random().toString(16).slice(2);}
      function handleBackgroundImage(e){const file=e.target.files&&e.target.files[0]; if(!file)return; clearBackgroundImage(); state.bgUrl=URL.createObjectURL(file); els.bg.style.backgroundImage=`url("${state.bgUrl}")`;}
      function clearBackgroundImage(){if(state.bgUrl)URL.revokeObjectURL(state.bgUrl); state.bgUrl=null; els.bg.style.backgroundImage=""; $("bgInput").value="";}
      function randomizeIdleColors(){const choices=["R","B","G","Y"], out=Array(20).fill(null); out[0]="V"; out[14]="V"; const pick=(prev,blocked=null)=>{let opts=choices.filter(x=>x!==prev&&x!==blocked); if(!opts.length)opts=choices.filter(x=>x!==prev); return opts[randomIndex(opts.length)];}; for(let pos=2;pos<=20;pos++){if(pos===15)continue; let blocked=null; if(pos===16)blocked=out[3]; if(pos===20)blocked=out[11]; out[pos-1]=pick(out[pos-2],blocked);} $("idleColorsInput").value=out.join(",");}
      function toast(title,details=""){els.toastTitle.textContent=title||""; els.toastDetails.textContent=details||""; els.toast.hidden=false; clearTimeout(toast.timeout); toast.timeout=setTimeout(()=>{els.toast.hidden=true;},6000);}
      function clampNum(value,min,max,fallback){const n=Number(value); return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback;}
      function normalizeHex(value,fallback){const t=String(value||"").trim(); if(/^#[0-9a-f]{6}$/i.test(t))return t; if(/^#[0-9a-f]{3}$/i.test(t))return `#${t[1]}${t[1]}${t[2]}${t[2]}${t[3]}${t[3]}`; return fallback;}
